[package]
name = "lso-core"
description = "Local Send Online core: libp2p node, NAT traversal, direct-only file transfer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libp2p = { version = "0.57", features = [
    "tokio", "quic", "tcp", "noise", "yamux", "dns",
    "identify", "kad", "relay", "dcutr", "ping", "upnp", "mdns",
    "macros", "serde",
    # Every key type: the public IPFS bootstrap nodes (Qm… PeerIds) use RSA.
    "ed25519", "rsa", "ecdsa", "secp256k1",
] }
libp2p-stream = "0.5.0-alpha"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
either = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
directories = "6"
getrandom = "0.3"
