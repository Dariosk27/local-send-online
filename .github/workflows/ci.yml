name: ci

on:
  push:
    branches-ignore: [test-kit]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build + unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: lso-${{ matrix.os }}
          path: |
            target/release/lso
            target/release/lso.exe

  # Real processes behind real Linux NAT in network namespaces (see tests/netlab).
  netlab:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: lso-ubuntu-latest, path: bin }
      - run: chmod +x bin/lso
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables libnetfilter-queue-dev python3-dev
      # Latency: netem if the runner kernel has it, else the NFQUEUE fallback.
      - run: sudo modprobe sch_netem || sudo pip install --break-system-packages NetfilterQueue
      - run: sudo env LSO_BIN=$PWD/bin/lso SIZE_MB=40 tests/netlab/scenarios.sh

  # Real Internet, real OSes: macOS receives, Windows sends, using only the
  # public IPFS DHT + public relays for signalling. The outcome depends on the
  # NATs of GitHub's hosting providers, which we do not control: a failure here
  # with the "hole punching" diagnosis is a legitimate, informative result, so
  # the jobs do not fail the workflow.
  # Verbose control-plane log against the real public IPFS network.
  internet-diag:
    # Costly (macOS minutes count 10x): run only on manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "lso-${{ matrix.os }}", path: bin }
      - run: chmod +x bin/lso
      - run: bin/lso -v --identity-seed "ci-$GITHUB_RUN_ID-diagv-${{ matrix.os }}" diag --seconds 40 2>&1 | head -400
        env:
          RUST_LOG: info,libp2p_swarm=debug,libp2p_identify=debug,libp2p_dns=debug,libp2p_kad=info,libp2p_relay=debug

  internet-mac-receiver:
    # Costly (macOS minutes count 10x): run only on manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: lso-macos-latest, path: bin }
      - run: chmod +x bin/lso
      - name: diagnose NAT
        run: bin/lso --identity-seed "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-diag-mac" diag --seconds 30 || true
      - name: receive
        run: |
          python3 tests/gen_file.py "ci-$GITHUB_RUN_ID" 50 expected.bin
          bin/lso --identity-seed "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-mac" -v \
            receive --dir out --yes --once
          shasum -a 256 expected.bin out/*
          cmp expected.bin out/expected.bin

  internet-windows-sender:
    # Costly (macOS minutes count 10x): run only on manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: lso-windows-latest, path: bin }
      - name: diagnose NAT
        run: bin/lso.exe --identity-seed "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-diag-win" diag --seconds 30 || true
      - name: send to the macOS runner (PeerId only, found through the DHT)
        run: |
          python tests/gen_file.py "ci-$GITHUB_RUN_ID" 50 expected.bin
          target=$(bin/lso.exe --identity-seed "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-mac" id)
          echo "receiver PeerId: $target"
          for i in 1 2 3 4 5 6; do
            bin/lso.exe --identity-seed "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-win" -v send "$target" expected.bin && exit 0
            echo "attempt $i failed (receiver not announced yet, or no direct path); retrying in 60s"
            sleep 60
          done
          exit 1

  # macOS binary for both Apple Silicon and Intel Macs.
  mac-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output lso target/aarch64-apple-darwin/release/lso target/x86_64-apple-darwin/release/lso
          lipo -info lso
      - uses: actions/upload-artifact@v4
        with: { name: lso-macos-universal, path: lso }

  # Desktop app (Tauri): .dmg for macOS (universal), NSIS installer for Windows.
  desktop-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: build app bundle
        working-directory: app/src-tauri
        shell: bash
        run: npx -y @tauri-apps/cli@2 build ${{ matrix.args }}
      - name: collect
        shell: bash
        run: |
          mkdir out
          find app/src-tauri/target -path '*release/bundle/dmg/*.dmg' -exec cp {} out/LocalSendOnline.dmg \;
          find app/src-tauri/target -path '*release/bundle/nsis/*.exe' -exec cp {} out/LocalSendOnline-Setup.exe \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: out/*

  # Linux ARM64 CLI (Oracle Cloud "Always Free" servers are ARM): used by
  # scripts/install-relay.sh.
  linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p lso-cli
      - uses: actions/upload-artifact@v4
        with: { name: lso-linux-aarch64, path: target/release/lso }

  # Test kit to hand to testers: Windows + Mac binaries, double-click
  # scripts, instructions. Published as an artifact and on the test-kit branch.
  kit:
    needs: [build, mac-universal, desktop-app, linux-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: lso-windows-latest, path: win }
      - uses: actions/download-artifact@v4
        with: { name: lso-macos-universal, path: mac }
      - uses: actions/download-artifact@v4
        with: { name: lso-ubuntu-latest, path: linux-x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: lso-linux-aarch64, path: linux-aarch64 }
      - uses: actions/download-artifact@v4
        with: { name: app-macos-latest, path: appmac }
      - uses: actions/download-artifact@v4
        with: { name: app-windows-latest, path: appwin }
      - name: assemble
        run: |
          K=LocalSendOnline-test
          cp -r packaging/kit $K
          cp win/lso.exe $K/Windows/
          cp mac/lso $K/Mac/
          chmod +x $K/Mac/lso $K/Mac/*.command
          sed -i 's/$/\r/' $K/Windows/*.bat $K/LEGGIMI.txt
          echo "build ${GITHUB_SHA::7} $(date -u +%F)" > $K/VERSIONE.txt
          zip -r -X LocalSendOnline-test.zip $K
      - uses: actions/upload-artifact@v4
        with: { name: LocalSendOnline-test, path: LocalSendOnline-test.zip }
      - name: publish on test-kit branch
        if: github.event_name == 'push'
        run: |
          mkdir pub && mv LocalSendOnline-test.zip pub/
          cp appmac/LocalSendOnline.dmg appwin/LocalSendOnline-Setup.exe pub/
          cp linux-x86_64/lso pub/lso-linux-x86_64
          cp linux-aarch64/lso pub/lso-linux-aarch64
          cd pub
          git init -q -b test-kit
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "test kit ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-kit
